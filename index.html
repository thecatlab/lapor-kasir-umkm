<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="application-version" content="2026.09.22.2">
    <meta name="referrer" content="no-referrer">
    <title>LaporKasir</title>
    
    <!-- Favicon (Wallet Icon) -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>'>

    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input[type="date"] { display: block; -webkit-appearance: none; -moz-appearance: none; text-align: center; }
        .safe-area-pb { padding-bottom: env(safe-area-inset-bottom, 1rem); }
        .tab-active { background-color: white; color: #0f172a; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #334155; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 min-h-screen pb-40">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative">
        <div class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
            <div class="px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="p-2 bg-emerald-100 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    </div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900">LaporKasir</h1>
                </div>
                <button onclick="window.confirmReset()" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors" title="Reset All">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>

            <div class="px-2 pb-3">
                <div class="flex p-1 bg-gray-100 rounded-xl space-x-1">
                    <button onclick="window.switchTab('start')" id="tab-start" class="flex-1 py-2 text-[11px] sm:text-xs font-medium rounded-lg transition-all duration-200 tab-active">Awal</button>
                    <button onclick="window.switchTab('end')" id="tab-end" class="flex-1 py-2 text-[11px] sm:text-xs font-medium rounded-lg transition-all duration-200 tab-inactive">Akhir</button>
                    <button onclick="window.switchTab('expenses')" id="tab-expenses" class="flex-1 py-2 text-[11px] sm:text-xs font-medium rounded-lg transition-all duration-200 tab-inactive">Pengeluaran</button>
                    <button onclick="window.switchTab('report')" id="tab-report" class="flex-1 py-2 text-[11px] sm:text-xs font-medium rounded-lg transition-all duration-200 tab-inactive">Laporan</button>
                </div>
            </div>
        </div>

        <main id="main-content" class="px-4 py-6 space-y-3"></main>

        <div id="footer-summary" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] p-4 safe-area-pb z-20">
            <div class="flex justify-between items-end mb-1">
                <span id="footer-label" class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Total Awal</span>
            </div>
            <div class="flex justify-between items-center">
                <div id="footer-total" class="text-3xl font-bold text-slate-900 tracking-tight">Rp 0</div>
                <button id="copy-btn" onclick="window.copyCurrentTotal()" class="hidden text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full hover:bg-emerald-100 transition-colors">Copy</button>
            </div>
        </div>

        <div id="confirm-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-all duration-200 opacity-0 pointer-events-none" style="transition: opacity 0.2s ease-out;">
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-200" id="confirm-modal-content">
                <h3 class="font-bold text-lg mb-2 text-slate-900" id="modal-title">Konfirmasi</h3>
                <p class="text-gray-600 mb-6 text-sm" id="modal-message">Apakah anda yakin?</p>
                <div id="modal-actions" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <div id="toast" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-sm font-medium text-center min-w-[200px]">Disalin ke clipboard!</div>
    </div>

    <dialog id="access-dialog" aria-labelledby="access-title" class="rounded-2xl p-6 w-full max-w-sm shadow-xl backdrop:bg-black/50">
        <form method="dialog" class="space-y-4">
            <h2 id="access-title" class="font-bold text-lg">Akses Penyimpanan Laporan</h2>
            <p class="text-sm text-gray-600">Masukkan kode akses dari pengelola. Kode hanya diingat selama halaman ini terbuka.</p>
            <label for="access-code" class="block text-sm font-medium">Kode akses</label>
            <input id="access-code" type="password" required maxlength="256" autocomplete="off" class="w-full p-3 border border-gray-300 rounded-lg">
            <div class="flex gap-3">
                <button type="button" onclick="this.closest('dialog').close('cancel')" class="flex-1 py-3 bg-gray-100 rounded-xl">Batal</button>
                <button value="submit" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl">Lanjutkan</button>
            </div>
        </form>
    </dialog>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const denominations = [
            { value: 100000, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200' },
            { value: 50000, color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-200' },
            { value: 20000, color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200' },
            { value: 10000, color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-200' },
            { value: 5000, color: 'text-yellow-700', bg: 'bg-yellow-50', border: 'border-yellow-200' },
            { value: 2000, color: 'text-gray-600', bg: 'bg-gray-100', border: 'border-gray-300' },
            { value: 1000, color: 'text-gray-500', bg: 'bg-gray-50', border: 'border-gray-200' },
            { value: 500, color: 'text-stone-500', bg: 'bg-stone-50', border: 'border-stone-200' },
        ];

        // Public deployment configuration only; access codes must never be placed here.
        const GOOGLE_SCRIPT_URL = (window.LAPORKASIR_CONFIG || {}).googleScriptUrl || '';
        let submissionToken = '';

        let currentMode = 'start';
        let shiftData = { start: {}, end: {}, expenses: [], qris: '', lainLain: '', setorTunai: '', qasir: '', notes: '', reportDate: new Date().toISOString().split('T')[0] };
        let isSubmittingReport = false;

        denominations.forEach(d => { shiftData.start[d.value] = ''; shiftData.end[d.value] = ''; });

        const savedData = localStorage.getItem('skmk_kas_data_v2');
        if (savedData) {
            try {
                const parsed = JSON.parse(savedData);
                if (parsed.start) shiftData.start = { ...shiftData.start, ...parsed.start };
                if (parsed.end) shiftData.end = { ...shiftData.end, ...parsed.end };
                if (Array.isArray(parsed.expenses)) shiftData.expenses = parsed.expenses;
                shiftData.qris = parsed.qris !== undefined ? parsed.qris : '';
                shiftData.lainLain = parsed.lainLain !== undefined ? parsed.lainLain : '';
                shiftData.setorTunai = parsed.setorTunai !== undefined ? parsed.setorTunai : '';
                
                shiftData.qasir = parsed.qasir !== undefined ? parsed.qasir : '';
                shiftData.notes = parsed.notes !== undefined ? parsed.notes : '';
                if (parsed.reportDate) shiftData.reportDate = parsed.reportDate;
            } catch (e) { console.error("Error loading save", e); }
        }

        const mainContent = document.getElementById('main-content');
        const footerLabel = document.getElementById('footer-label');
        const footerTotal = document.getElementById('footer-total');
        const copyBtn = document.getElementById('copy-btn');
        const footerContainer = document.getElementById('footer-summary');

        const formatter = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const numberFormatter = new Intl.NumberFormat('id-ID');

        // --- 2. HELPERS & FORMATTERS ---
        // Keep the legacy storage key so existing cashier drafts survive upgrades.
        function saveData() { localStorage.setItem('skmk_kas_data_v2', JSON.stringify(shiftData)); }

        function escapeHtml(value) {
            const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(value ?? '').replace(/[&<>"']/g, character => entities[character]);
        }

        function calculateTotal(mode) {
            if (mode === 'expenses') return shiftData.expenses.reduce((acc, curr) => acc + curr.amount, 0);
            const data = shiftData[mode];
            return denominations.reduce((acc, curr) => {
                const qty = data[curr.value];
                return acc + ((typeof qty === 'number' ? qty : 0) * curr.value);
            }, 0);
        }

        function getReportCalculations() {
            const startTotal = calculateTotal('start');
            const endTotal = calculateTotal('end');
            const expensesTotal = calculateTotal('expenses');
            
            const qris = typeof shiftData.qris === 'number' ? shiftData.qris : 0;
            const lainLain = typeof shiftData.lainLain === 'number' ? shiftData.lainLain : 0;
            const setorTunai = typeof shiftData.setorTunai === 'number' ? shiftData.setorTunai : 0;

            const netCashFlow = endTotal - startTotal;
            
            // Cash Income = (End Cash + Expenses + Setor Tunai) - Start Cash
            // NOTE: Pendapatan Lain-Lain is ALREADY inside 'endTotal', so it is naturally included in 'cashIncome'.
            const cashIncome = netCashFlow + expensesTotal + setorTunai;
            
            // Total Income (Real Money Received) = Cash Income + QRIS
            const totalIncome = cashIncome + qris;
            
            const qasir = typeof shiftData.qasir === 'number' ? shiftData.qasir : 0;
            
            // Discrepancy = Real Income - Target (Qasir) - Known Extra Income (Lain-Lain)
            const discrepancy = totalIncome - qasir - lainLain;
            
            return { startTotal, endTotal, expensesTotal, netCashFlow, cashIncome, qris, lainLain, setorTunai, totalIncome, qasir, discrepancy };
        }

        function formatLabel(value) {
            if (value >= 1000) return (value / 1000) + 'K';
            return value;
        }

        function getFormattedDate(isoDate) {
            if (!isoDate) return '';
            const parts = isoDate.split('-');
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            return dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message || "Disalin ke clipboard!";
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 2000);
        }

        // --- 3. CORE ACTIONS (Global) ---
        function updateFormattedInput(field, el) {
            const rawValue = el.value.replace(/\D/g, '');
            el.value = rawValue ? numberFormatter.format(rawValue) : '';
            shiftData[field] = rawValue === '' ? '' : parseInt(rawValue, 10);
            saveData();
            if (currentMode === 'report') updateReportMath();
        }

        function updateNotesInput(value) { shiftData.notes = value; saveData(); }
        function updateReportDate(value) { shiftData.reportDate = value; saveData(); renderContent(); }

        function switchTab(mode) {
            currentMode = mode;
            ['start', 'end', 'expenses', 'report'].forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (m === mode) { btn.classList.remove('tab-inactive'); btn.classList.add('tab-active'); }
                else { btn.classList.add('tab-inactive'); btn.classList.remove('tab-active'); }
            });
            renderContent();
            updateFooter();
        }

        function updateCount(value, qtyStr) {
            const counts = shiftData[currentMode];
            if (qtyStr === '') counts[value] = '';
            else { const num = parseInt(qtyStr); if (!isNaN(num) && num >= 0) counts[value] = num; }
            saveData(); updateFooter(); updateRowVisuals(value);
        }

        function updateRowVisuals(changedValue) {
            if (currentMode === 'expenses' || currentMode === 'report') return;
            const counts = shiftData[currentMode];
            const qty = counts[changedValue];
            const denom = denominations.find(d => d.value === changedValue);
            const subtotal = (qty || 0) * denom.value;
            const row = document.getElementById(`row-${changedValue}`);
            const subtotalEl = document.getElementById(`subtotal-${changedValue}`);
            if (qty) { row.className = `flex items-center p-3 rounded-xl border-2 transition-all duration-200 bg-white shadow-sm ${denom.border}`; } else { row.className = `flex items-center p-3 rounded-xl border-2 transition-all duration-200 bg-white shadow-sm border-transparent hover:border-gray-200`; }
            if (subtotal > 0) { subtotalEl.className = 'font-medium text-slate-900'; subtotalEl.textContent = formatter.format(subtotal).replace('Rp', '').trim(); } else { subtotalEl.className = 'font-medium text-gray-300'; subtotalEl.textContent = '-'; }
        }

        function updateFooter() {
            if (currentMode === 'report') return;
            const total = calculateTotal(currentMode);
            footerTotal.textContent = formatter.format(total);
            if (currentMode === 'start') footerLabel.textContent = 'Total Kas Awal';
            else if (currentMode === 'end') footerLabel.textContent = 'Total Kas Akhir';
            else if (currentMode === 'expenses') footerLabel.textContent = 'Total Pengeluaran';
            if (total > 0) copyBtn.classList.remove('hidden'); else copyBtn.classList.add('hidden');
        }

        function copyCurrentTotal() {
            const total = calculateTotal(currentMode);
            let label = "";
            if (currentMode === 'start') label = "Total Kas Awal";
            else if (currentMode === 'end') label = "Total Kas Akhir";
            else if (currentMode === 'expenses') label = "Total Pengeluaran";
            doCopy(`${label}: ${formatter.format(total)}`);
        }

        function doCopy(text) {
            if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast()).catch(() => fallbackCopy(text));
            else fallbackCopy(text);
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast(); } catch (err) { }
            document.body.removeChild(textArea);
        }

        // --- 4. EXPENSE & MODAL ACTIONS ---
        function addExpense() {
            const nameEl = document.getElementById('expense-name');
            const qtyEl = document.getElementById('expense-qty');
            const unitEl = document.getElementById('expense-unit');
            const priceEl = document.getElementById('expense-price');
            
            const name = nameEl.value.trim();
            const rawQty = qtyEl.value.replace(',', '.');
            const qty = rawQty ? parseFloat(rawQty) : ''; 
            const unit = unitEl.value.trim();
            const price = parseInt(priceEl.value);

            if (!name || isNaN(price) || price <= 0) { showToast('Mohon isi nama dan harga!'); return; }

            shiftData.expenses.push({ id: Date.now(), name: name, qty: qty, unit: unit, amount: price });
            nameEl.value = ''; qtyEl.value = ''; unitEl.value = ''; priceEl.value = ''; nameEl.focus();
            saveData(); renderContent(); updateFooter();
        }

        function deleteExpense(id) {
            openModal('Hapus Pengeluaran?', 'Item ini akan dihapus dari daftar.', () => {
                shiftData.expenses = shiftData.expenses.filter(e => e.id !== id);
                saveData(); renderContent(); updateFooter();
            });
        }

        function confirmReset() {
            openModal('Reset Semua Data?', 'Data Awal, Akhir, Pengeluaran, dan Laporan akan dihapus total.', () => {
                denominations.forEach(d => { shiftData.start[d.value] = ''; shiftData.end[d.value] = ''; });
                shiftData.expenses = []; 
                shiftData.qris = ''; shiftData.lainLain = ''; shiftData.setorTunai = '';
                shiftData.qasir = ''; shiftData.notes = ''; shiftData.reportDate = new Date().toISOString().split('T')[0];
                submissionToken = '';
                saveData(); renderContent(); updateFooter(); showToast('Data berhasil di-reset');
            });
        }

        function getModalButtonClass(variant) {
            if (variant === 'primary') return 'w-full py-3 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition-colors';
            if (variant === 'danger') return 'w-full py-3 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition-colors';
            return 'w-full py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-colors';
        }

        function openActionModal(title, message, actions) {
            const modal = document.getElementById('confirm-modal');
            const actionContainer = document.getElementById('modal-actions');
            document.getElementById('toast').classList.add('opacity-0');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            actionContainer.innerHTML = '';
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = action.label;
                btn.className = getModalButtonClass(action.variant);
                btn.onclick = () => {
                    if (action.callback) action.callback();
                    closeModal();
                };
                actionContainer.appendChild(btn);
            });
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('confirm-modal-content').classList.remove('scale-95'); document.getElementById('confirm-modal-content').classList.add('scale-100'); }, 10);
        }

        function openModal(title, message, actionCallback) {
            openActionModal(title, message, [
                { label: 'Batal', variant: 'secondary' },
                { label: 'Ya, Hapus', variant: 'danger', callback: actionCallback }
            ]);
        }

        function closeModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('confirm-modal-content').classList.remove('scale-100');
            document.getElementById('confirm-modal-content').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        // --- 5. RENDER FUNCTIONS ---
        function renderDenomGrid(data, title) {
            let html = `<div class="mb-4"><div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2 text-center">${title}</div><div class="grid grid-cols-4 gap-2">`;
            denominations.forEach(d => {
                const count = data[d.value] || 0;
                html += `
                    <div class="flex flex-col rounded-xl overflow-hidden border ${d.border}">
                        <div class="${d.bg} ${d.color} text-xs font-bold py-2 h-auto min-h-[30px] flex items-center justify-center">
                            ${formatLabel(d.value)}
                        </div>
                        <div class="bg-white text-slate-800 font-bold text-xl py-2 h-auto min-h-[32px] flex items-center justify-center">
                            ${escapeHtml(count)}
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        function renderReport() {
            const vals = getReportCalculations();
            const formattedQris = shiftData.qris === '' ? '' : numberFormatter.format(shiftData.qris);
            const formattedLainLain = shiftData.lainLain === '' ? '' : numberFormatter.format(shiftData.lainLain);
            const formattedSetorTunai = shiftData.setorTunai === '' ? '' : numberFormatter.format(shiftData.setorTunai);
            const formattedQasir = shiftData.qasir === '' ? '' : numberFormatter.format(shiftData.qasir);
            const formattedDate = getFormattedDate(shiftData.reportDate);
            let discLabel = '', discColor = '';
            if (vals.discrepancy === 0) { discLabel = 'Sudah Sesuai'; discColor = 'text-emerald-600'; }
            else if (vals.discrepancy > 0) { discLabel = 'Surplus (Lebih)'; discColor = 'text-yellow-600'; }
            else { discLabel = 'Defisit (Kurang)'; discColor = 'text-red-600'; }

            const gridAwal = renderDenomGrid(shiftData.start, 'Rincian Fisik Awal');
            const gridAkhir = renderDenomGrid(shiftData.end, 'Rincian Fisik Akhir');

            mainContent.innerHTML = `<div id="report-card" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-5"><h2 class="text-center font-bold text-gray-900 text-lg">Laporan & Rekonsiliasi</h2><div class="mb-2 text-center"><label class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Tanggal Laporan</label><div class="mt-1 relative flex items-center justify-center cursor-pointer hover:opacity-80 transition-opacity"><div class="text-slate-800 font-bold text-lg border-b border-gray-200 pb-1 px-4 min-w-[200px]">${formattedDate}</div><input type="date" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" value="${escapeHtml(shiftData.reportDate)}" onchange="window.updateReportDate(this.value)" onclick="try{this.showPicker()}catch(e){}"></div><div class="text-[10px] text-gray-300 mt-1">Ketuk tanggal untuk mengganti</div></div><div class="space-y-2 text-sm border-b border-gray-100 pb-4"><div class="flex justify-between text-gray-600"><span>Kas Awal</span><span class="font-medium">${formatter.format(vals.startTotal)}</span></div><div class="flex justify-between text-gray-600"><span>Kas Akhir</span><span class="font-medium">${formatter.format(vals.endTotal)}</span></div><div class="flex justify-between text-gray-600"><span>Selisih Kas</span><span class="font-medium ${vals.netCashFlow >=0 ? 'text-green-600' : 'text-red-600'}">${formatter.format(vals.netCashFlow)}</span></div><div class="flex justify-between text-gray-600"><span>Total Pengeluaran</span><span class="font-medium text-red-600">-${formatter.format(vals.expensesTotal)}</span></div><div class="flex justify-between font-semibold pt-2 border-t border-gray-50 mt-2 text-slate-800"><span>Pendapatan Cash</span><span id="rep-pendapatan-cash">${formatter.format(vals.cashIncome)}</span></div></div><div class="space-y-4"><div><label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Pendapatan QRIS/Transfer</label><div class="relative"><div cla         function getScreenshotFilename() {

        function getReportText() {
            const vals = getReportCalculations();
            const dateStr = getFormattedDate(shiftData.reportDate);
            let expenseDetails = "";
            if (shiftData.expenses.length > 0) {
                expenseDetails = "\n\nRincian Pengeluaran:\n" + shiftData.expenses.map(e => {
                    const unitStr = e.unit ? ` ${e.unit}` : '';

                    return `- ${label}: ${formatter.format(e.amount)}`;

            return `*Laporan Rekonsiliasi*\nTanggal: ${dateStr}\n\nKas Awal: ${formatter.format(vals.startTotal)}\nKas Akhir: ${formatter.format(vals.endTotal)}\nSelisih Kas: ${formatter.format(vals.netCashFlow)}\nTotal Pengeluaran: ${formatter.format(vals.expensesTotal)}\nSetor Tunai: ${formatter.format(vals.setorTunai)}\n\nPendapatan Cash: ${formatter.format(vals.cashIncome)}\nPendapatan QRIS: ${formatter.format(vals.qris)}\nPendapatan Lain-Lain: ${formatter.format(vals.lainLain)}\n\n*Total Pendapatan: ${formatter.format(vals.totalIncome)}*\n*Total App Qasir: ${formatter.format(vals.qasir)}*\n------------------\n*SELISIH AKHIR: ${formatter.format(vals.discrepancy)}*\n(${statusStr})\n\nKeterangan:\n${shiftData.notes || '-'}${expenseDetails}`;

        function getDiscrepancyStatus(vals) {
            if (vals.discrepancy === 0) return 'SUDAH SESUAI';
            if (vals.discrepancy > 0) return 'SURPLUS (LEBIH)';
            return 'DEFISIT (KURANG)';

        function createRequestId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
        }

        function getDenominationSnapshot(data) {
            const snapshot = {};
            denominations.forEach(d => {
                snapshot[d.value] = typeof data[d.value] === 'number' ? data[d.value] : 0;
            });
            return snapshot;
        }

        function getExpenseSnapshot() {
            return shiftData.expenses.map((expense, index) => ({
                index: index + 1,
                name: expense.name || '',
                qty: expense.qty === '' || expense.qty === undefined ? '' : expense.qty,
                unit: expense.unit || '',
                amount: typeof expense.amount === 'number' ? expense.amount : 0
            }));
        }

        function buildReportPayload(reportText, filename, base64) {
            const vals = getReportCalculations();
            return {
                requestId: createRequestId(),
                reportDate: shiftData.reportDate,
                submittedClientAt: new Date().toISOString(),
                reportText: reportText,
                calculations: vals,
                discrepancyStatus: getDiscrepancyStatus(vals),
                denominations: {
                    start: getDenominationSnapshot(shiftData.start),
                    end: getDenominationSnapshot(shiftData.end)
                },
                expenses: getExpenseSnapshot(),
                notes: shiftData.notes || '',
                image: {
                    filename: filename,
                    base64: base64
                }
            };
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
                reader.onerror = () => reject(new Error('Gagal membaca gambar laporan.'));
                reader.readAsDataURL(blob);
            });
        }

        function buildReportSubmissionContext() {
            const reportText = getReportText();
            const filename = getScreenshotFilename();
            const fallback = {
                reportText: reportText,
                filename: filename,
                file: null,
                payload: buildReportPayload(reportText, filename, '')
            };
            const clone = prepareScreenshotClone();
            document.body.appendChild(clone);

            const screenshotPromise = html2canvas(clone, {
                scale: window.innerWidth <= 600 ? 1 : 1.5,
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: true
            }).then(canvas => new Promise((resolve, reject) => {
                canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Gagal membuat file gambar laporan.')), 'image/png');
            })).then(blob => blobToBase64(blob).then(base64 => ({
                reportText: reportText,
                filename: filename,
                file: new File([blob], filename, { type: 'image/png' }),
                payload: buildReportPayload(reportText, filename, base64)
            })));

            const timeoutPromise = new Promise((resolve, reject) => {
                setTimeout(() => reject(new Error('Pembuatan gambar terlalu lama.')), 10000);
            });

            return Promise.race([screenshotPromise, timeoutPromise])
                .catch(err => {
                    console.error('Screenshot tidak tersedia, laporan tetap dikirim.', err);
                    return fallback;
                })
                .finally(() => {
                    if (document.body.contains(clone)) document.body.removeChild(clone);
                });
        }

        async function checkStorageConnection(button) {
            if (isSubmittingReport) return;
            button.disabled = true;
            button.textContent = 'Memeriksa koneksi...';
            try {
                const response = await submitReportToAppsScript({ requestId: createRequestId(), action: 'checkConnection' });
                if (!response || response.ok !== true || response.status !== 'ready') {
                    throw new Error(response && response.message || 'Koneksi penyimpanan belum siap.');
                }
                openActionModal('Koneksi Siap', 'Google Sheets dan folder Drive dapat diakses. Tidak ada laporan yang dibuat.', [
                    { label: 'Tutup', variant: 'primary' }
                ]);
            } catch (error) {
                openActionModal('Koneksi Belum Siap', error.message || 'Periksa konfigurasi penyimpanan.', [
                    { label: 'Tutup', variant: 'secondary' }
                ]);
            } finally {
                button.disabled = false;
                button.textContent = 'Periksa koneksi penyimpanan';
            }
        }

        function getSubmissionToken() {
            if (submissionToken) return Promise.resolve(submissionToken);
            const dialog = document.getElementById('access-dialog');
            const input = document.getElementById('access-code');
            input.value = '';
            dialog.returnValue = '';
            return new Promise((resolve, reject) => {
                dialog.addEventListener('close', () => {
                    const value = input.value;
                    input.value = '';
                    if (dialog.returnValue !== 'submit' || !value) {
                        reject(new Error('Penyimpanan dibatalkan. Laporan tetap tersedia di perangkat.'));
                        return;
                    }
                    submissionToken = value;
                    resolve(value);
                }, { once: true });
                dialog.showModal();
                input.focus();
            });
        }

        function isAppsScriptResponse(event, iframe) {
            // Apps Script replies from a sandboxed child of the submission iframe.
            if (!/^https:\/\/(script\.google\.com|script\.googleusercontent\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(event.origin)) return false;
            try {
                let source = event.source;
                for (let depth = 0; source && depth < 5; depth++) {
                    if (source === iframe.contentWindow) return true;
                    if (source === source.parent) break;
                    source = source.parent;
                }
            } catch (error) { return false; }
            return false;
        }

        async function submitReportToAppsScript(payload) {
            if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(GOOGLE_SCRIPT_URL)) {
                throw new Error('Penyimpanan cloud belum dikonfigurasi. Hubungi pengelola atau lanjutkan tanpa menyimpan.');
            }
            if (window.location.origin === 'null') {
                throw new Error('Gunakan alamat HTTP lokal atau HTTPS untuk menyimpan ke cloud.');
            }
            const authToken = await getSubmissionToken();
            return new Promise((resolve, reject) => {
                const iframeName = `apps-script-submit-${payload.requestId}`;
                const iframe = document.createElement('iframe');
                const form = document.createElement('form');
                const input = document.createElement('input');
                let timeoutId;

                function cleanup() {
                    clearTimeout(timeoutId);
                    input.value = '';
                    window.removeEventListener('message', onMessage);
                    if (document.body.contains(form)) document.body.removeChild(form);
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }

                function onMessage(event) {
                    if (!isAppsScriptResponse(event, iframe)) return;
                    let data = event.data;
                    if (typeof data === 'string') {
                        try { data = JSON.parse(data); } catch (e) { return; }
                    }
                    if (!data || data.source !== 'laporkasir-apps-script' || data.requestId !== payload.requestId) return;
                    if (data.response && data.response.code === 'UNAUTHORIZED') submissionToken = '';
                    cleanup();
                    resolve(data.response || data);
                }

                iframe.name = iframeName;
                iframe.className = 'hidden';
                form.method = 'POST';
                form.action = GOOGLE_SCRIPT_URL;
                form.target = iframeName;
                form.enctype = 'application/x-www-form-urlencoded';
                form.className = 'hidden';
                input.type = 'hidden';
                input.name = 'payload';
                input.value = JSON.stringify({ ...payload, authToken, clientOrigin: window.location.origin });
                form.appendChild(input);

                timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('Tidak ada respons dari server. Periksa deployment Apps Script.'));
                }, 60000);

                window.addEventListener('message', onMessage);
                document.body.appendChild(iframe);
                document.body.appendChild(form);
                form.submit();
            });
        }

        function shareReportContext(context, fromUserGesture) {
            if (navigator.clipboard) navigator.clipboard.writeText(context.reportText).catch(() => {});
            const shareData = context.file ? { files: [context.file], text: context.reportText, title: 'Laporan Kasir' } : null;
            const textOnlyShareData = { text: context.reportText, title: 'Laporan Kasir' };

            if (shareData && navigator.canShare && navigator.canShare(shareData)) {
                navigator.share(shareData)
                    .then(() => showToast('Laporan berhasil dibagikan!'))
                    .catch(e => {
                        if (e.name === 'AbortError') return;
                        if (!fromUserGesture) openShareRetryModal(context);
                        else showToast('Gagal membuka menu share.');
                    });
                return;
            }

            if (navigator.share) {
                navigator.share(textOnlyShareData)
                    .then(() => showToast('Teks laporan berhasil dibagikan!'))
                    .catch(e => {
                        if (e.name === 'AbortError') return;
                        if (!fromUserGesture) openShareRetryModal(context);
                        else doCopy(context.reportText);
                    });
                return;
            }

            doCopy(context.reportText);
            showToast('Browser menolak file gambar. Teks sudah disalin.');
        }

        function downloadReportContext(context) {
            if (!context.file) {
                showToast(context.savedToCloud ? 'Data tersimpan, tetapi gambar gagal dibuat.' : 'Gambar gagal dibuat. Teks laporan tetap tersedia.');
                return;
            }
            const link = document.createElement('a');
            const objectUrl = URL.createObjectURL(context.file);
            link.download = context.filename;
            link.href = objectUrl;
            link.click();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            showToast(context.savedToCloud ? 'Data dan gambar berhasil disimpan!' : 'Gambar berhasil disimpan di perangkat.');
        }

        function runReportAction(context, action, fromUserGesture) {
            if (action === 'download') downloadReportContext(context);
            else shareReportContext(context, fromUserGesture);
        }

        function openShareRetryModal(context) {
            openActionModal('Laporan Tersimpan', 'Ketuk tombol di bawah untuk membuka menu WhatsApp/share.', [
                { label: 'Batal', variant: 'secondary' },
                { label: 'Bagikan Sekarang', variant: 'primary', callback: () => shareReportContext(context, true) }
            ]);
        }

        function openDuplicateModal(context, response, action) {
            const actionLabel = action === 'download' ? 'Simpan Gambar Lagi' : 'Bagikan Lagi';
            openActionModal('Laporan Sudah Terekam', response.message || 'Laporan sudah terekam di database.', [
                { label: 'Batal', variant: 'secondary' },
                { label: actionLabel, variant: 'primary', callback: () => runReportAction(context, action, true) }
            ]);
        }

        function openSaveErrorModal(context, err, action) {
            const message = err && err.message ? err.message : 'Laporan gagal disimpan ke Google Sheet.';
            const continueLabel = action === 'download' ? 'Simpan gambar saja' : 'Bagikan tanpa menyimpan';
            openActionModal('Gagal Menyimpan', message, [
                { label: 'Batal', variant: 'secondary' },
                { label: continueLabel, variant: 'secondary', callback: () => runReportAction(context, action, true) },
                { label: 'Coba Lagi', variant: 'primary', callback: () => handleReportAndSave(action) }
            ]);
        }

        function prepareScreenshotClone() {
            const original = document.getElementById('report-card');
            const clone = original.cloneNode(true);
            
            clone.style.position = 'fixed';
            clone.style.top = '-10000px';
            clone.style.left = '-10000px';
            clone.style.width = '500px'; 
            
            clone.classList.add('bg-white', 'px-8', 'py-8');
            
            const now = new Date();
            const datePart = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const timestampDiv = document.createElement('div');
            timestampDiv.className = "mt-8 text-[10px] text-gray-400 font-medium";
            timestampDiv.innerText = `Diambil pada ${datePart} ${hours}:${minutes}`;
            
            clone.appendChild(timestampDiv);

            // Find the container holding the income inputs and tighten the spacing
            const labels = Array.from(clone.querySelectorAll('label'));
            const qrisLabel = labels.find(l => l.textContent.includes('Pendapatan QRIS'));
            if (qrisLabel) {
                const incomeContainer = qrisLabel.closest('.space-y-4');
                if (incomeContainer) {
                    incomeContainer.classList.remove('space-y-4');
                    incomeContainer.classList.add('space-y-2'); 
                }
            }

            // html2canvas renders text slightly larger/differently, causing clipping in tight boxes.
            // We increase the container heights in the CLONE only, leaving the web UI compact.
            const gridCells = clone.querySelectorAll('.grid > .flex-col');
            gridCells.forEach(cell => {
                // 1. Adjust Label (Top part)
                const labelDiv = cell.firstElementChild;
                if (labelDiv) {
                    labelDiv.classList.remove('h-7'); // Remove tight height
                    // Use padding to let content breathe and prevent clipping
                    labelDiv.classList.add('py-2', 'h-auto', 'min-h-[30px]'); 
                    // Ensure flex centering handles the new height
                    labelDiv.classList.add('flex', 'items-center', 'justify-center'); 
                }

                // 2. Adjust Amount (Bottom part)
                const amountDiv = cell.lastElementChild;
                if (amountDiv) {
                    amountDiv.classList.remove('h-10'); // Remove tight height
                    // Use padding to let content breathe and prevent clipping
                    amountDiv.classList.add('py-2', 'h-auto', 'min-h-[32px]');    
                    // Ensure flex centering handles the new height
                    amountDiv.classList.add('flex', 'items-center', 'justify-center');
                }
            });

            const dateContainer = clone.querySelector('.mb-4.text-center');
            if (dateContainer) {
                if (dateContainer.querySelector('.text-\\[10px\\]')) dateContainer.querySelector('.text-\\[10px\\]').remove();
                const dateWrapper = dateContainer.querySelector('.relative');
                if (dateWrapper) {
                    dateWrapper.classList.remove('cursor-pointer', 'hover:opacity-80');
                    if(dateWrapper.querySelector('input')) dateWrapper.querySelector('input').remove();
                    if(dateWrapper.querySelector('.border-b')) dateWrapper.querySelector('.border-b').classList.remove('border-b', 'border-gray-200', 'pb-1');
                }
            }

            const replaceInputWithStatic = (inputName, labelText, value) => {
                const labels = Array.from(clone.querySelectorAll('label'));
                const targetLabel = labels.find(l => l.textContent.includes(labelText));
                if (targetLabel) {
                    const container = targetLabel.parentElement;
                    const staticRow = document.createElement('div');
                    staticRow.className = "flex justify-between text-gray-600 text-sm py-1";
                    staticRow.innerHTML = `<span>${labelText}</span><span class="font-medium">${formatter.format(value)}</span>`;
                    container.replaceWith(staticRow);
                }
            };
            
            replaceInputWithStatic('qris', 'Pendapatan QRIS/Transfer', typeof shiftData.qris === 'number' ? shiftData.qris : 0);
            replaceInputWithStatic('lainLain', 'Pendapatan Lain-Lain', typeof shiftData.lainLain === 'number' ? shiftData.lainLain : 0);
            replaceInputWithStatic('setorTunai', 'Setor Tunai (Diambil dari Kas)', typeof shiftData.setorTunai === 'number' ? shiftData.setorTunai : 0);
            
            replaceInputWithStatic('qasir', 'Total Pendapatan Qasir (App)', typeof shiftData.qasir === 'number' ? shiftData.qasir : 0);
            
            const notesLabel = Array.from(clone.querySelectorAll('label')).find(l => l.textContent.includes('Keterangan Selisih'));
            if (notesLabel) {
                const container = notesLabel.parentElement;
                const noteText = shiftData.notes || '-';
                const staticNote = document.createElement('div');
                staticNote.className = "mt-4 space-y-1";
                staticNote.innerHTML = `<div class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Keterangan Selisih</div><div class="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(noteText)}</div>`;
                container.replaceWith(staticNote);
            }
            
            if(clone.querySelector('[data-html2canvas-ignore]')) clone.querySelector('[data-html2canvas-ignore]').remove();
            return clone;
        }

        function captureScreenshot() {
            handleReportAndSave('download');
        }

        function handleReportAndSave(action = 'share') {
            if (isSubmittingReport) return;
            let context = null;
            setReportSubmitting(true, action);
            showToast('Menyimpan laporan...');

            buildReportSubmissionContext()
                .then(ctx => {
                    context = ctx;
                    return submitReportToAppsScript(ctx.payload);
                })
                .then(response => {
                    setReportSubmitting(false);
                    if (!response || response.ok === false) throw new Error((response && response.message) || 'Laporan gagal disimpan.');

                    if (response.status === 'duplicate') {
                        context.savedToCloud = true;
                        openDuplicateModal(context, response, action);
                        return;
                    }

                    if (response.status === 'saved') {
                        context.savedToCloud = true;
                        if (action === 'download') showToast('Laporan tersimpan. Menyimpan gambar...');
                        else showToast('Laporan tersimpan. Membuka WhatsApp...');
                        runReportAction(context, action, false);
                        return;
                    }

                    throw new Error('Respons server tidak dikenal.');
                })
                .catch(err => {
                    console.error(err);
                    setReportSubmitting(false);
                    if (context) openSaveErrorModal(context, err, action);
                    else showToast('Gagal memproses laporan.');
                });
        }

        function copyReport() {
            doCopy(getReportText());
        }

        // --- 8. EXPOSE TO WINDOW ---
        window.switchTab = switchTab;
        window.confirmReset = confirmReset;
        window.copyCurrentTotal = copyCurrentTotal;
        window.updateCount = updateCount;
        window.addExpense = addExpense;
        window.deleteExpense = deleteExpense;
        window.updateFormattedInput = updateFormattedInput;
        window.updateNotesInput = updateNotesInput;
        window.updateReportDate = updateReportDate;
        window.captureScreenshot = captureScreenshot;
        window.handleReportAndSave = handleReportAndSave;
        window.copyReport = copyReport;
        window.closeModal = closeModal;

        // --- 9. INIT ---
        switchTab('start');
    </script>
